<!DOCTYPE html>
<html lang="en" data-theme="void">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0o777 — Mods, Accounts &amp; Subscriptions</title>
  <meta name="description" content="Game mods, ready-to-use accounts, and subscriptions — delivered instantly. Buy once, keep forever, free updates.">
  <meta name="theme-color" content="#050506">
  <meta property="og:title" content="0o777 — Mods, Accounts &amp; Subscriptions">
  <meta property="og:description" content="Delivered the second you pay. Mods, accounts and memberships in one store.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!--
    Locks the page down to the handful of origins it actually needs:
    Supabase (API, storage, realtime websocket), esm.sh (the Supabase
    client), and Google Fonts. Anything injected that tries to phone
    somewhere else is refused by the browser.

    Note: frame-ancestors and X-Frame-Options only work as real HTTP
    headers, which GitHub Pages won't send — js/boot.js handles framing.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    form-action 'self';
    script-src 'self' https://esm.sh;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob: https:;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh;
  ">

  <script src="js/boot.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main id="app"></main>
  <div id="site-footer"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
